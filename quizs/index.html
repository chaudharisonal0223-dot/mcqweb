<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/sonal.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">QuizMaster.</a>
            <!-- <span class="text-light">Test Your Knowledge</span> -->
            <div class="d-flex">
                <a href="">Home</a>
                <a href="">About</a>
                <a href="">service</a>
                <a href="">Contact</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <!-- Home Page -->
        <section id="home" class="hero text-center">
            <div class="badge rounded-pill px-3 py-2 mb-3">
                Welcome to Quiz Master
            </div>

            <h1>Challenge Your <span>Mind</span></h1>
            <p class="text-light mt-3">
                Learn new things, test your skills and become a champion.
            </p>

            <div class="row justify-content-center g-3 my-4">
                <div class="col-6 col-md-3">
                    <div class="info-card">
                        <h3>5</h3>
                        <p>Questions</p>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="info-card">
                        <h3>30s</h3>
                        <p>Per Question</p>
                    </div>
                </div>
            </div>

            <button class="btn start-btn" onclick="startQuiz()">
                Start Quiz ->
            </button>
        </section>

        <!-- Quiz Page -->
        <section id="quiz" class="quiz-card d-none">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span id="question-count">Question 1 of 5</span>
                <span class="timer"> <span id="time">30</span>s</span>
            </div>

            <div class="progress mb-4">
                <div id="progress" class="progress-bar" style="width: 20%"></div>
            </div>

            <h2 id="question">Question goes here</h2>

            <div id="options" class="mt-4"></div>

            <button id="next-btn" class="btn start-btn w-100 mt-4" onclick="nextQuestion()" disabled>
                Next Question ->
            </button>
        </section>

        <!-- Result Page -->
        <section id="result" class="hero text-center d-none">
            <div class="result-icon"></div>
            <h1>Quiz <span>Completed!</span></h1>
            <p class="text-light">Great job! Here is your result.</p>

            <div class="info-card my-4">
                <p>Your Score</p>
                <h2 id="final-score">0 / 5</h2>
                <h3 id="percentage">0%</h3>
                <p id="message"></p>
            </div>

            <button class="btn start-btn" onclick="startQuiz()">
                Try Again
            </button>
        </section>

    </main>

    
    <script src="./js/question.js"></script>
    <script src="./js/sonal.js"></script>
</body>

</html>
